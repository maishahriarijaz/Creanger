// Standalone E2E task: runs CreangerRealServerE2ETest against a LIVE
// Creanger Auth Server. The test itself skips (JUnit Assume) when the
// server is unreachable, so this task stays green in CI without a server.
// Drive it via scripts/run-creanger-e2e.sh, which manages the server
// lifecycle and surface the exact same invocation.
tasks.register('testCreangerE2E', Test) {
    group = 'verification'
    description = 'Runs CreangerRealServerE2ETest against a live Creanger Auth Server.'
    // Reuse the debug unit-test variant's compiled classes and classpath so
    // this task sees the same main sourceset, test sourceset, and test deps
    // as the regular `testDebugUnitTest` run. Resolved lazily because the
    // Android unit-test task is registered by AGP after configuration.
    def unitTest = tasks.named('testDebugUnitTest')
    testClassesDirs = files { unitTest.get().testClassesDirs }
    classpath = files { unitTest.get().classpath }
    filter {
        includeTestsMatching 'com.creanger.app.messenger.creanger.CreangerRealServerE2ETest'
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
    dependsOn 'compileDebugUnitTestJavaWithJavac'
}


def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        def v = props[propName]
        return v != null ? v : ""
    } else {
        return "";
    }
}
