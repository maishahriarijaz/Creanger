def isWindows = String.valueOf(DefaultNativePlatform.currentOperatingSystem.toFamilyName() == OperatingSystemFamily.WINDOWS)

// Supabase PROJECT URL (GoTrue under /auth/v1, PostgREST under /rest/v1).
// The legacy Custom Auth Server (creanger-auth workers.dev) was removed.
def creangerAuthBaseUrl() {
    def v = getProps("CREANGER_AUTH_BASE_URL")
    if (v != null && v.toString().trim().length() > 0) {
        return v.toString().trim()
    }
    return ""
}

def creangerSupabaseAnonKey() {
    def v = getProps("CREANGER_SUPABASE_ANON_KEY")
    return v == null ? "" : v.toString().trim()
}
android {
    compileSdkVersion 35
    buildToolsVersion '35.0.0'
    ndkVersion "27.2.12479018"

    sourceSets.main.jniLibs.srcDirs = ['./jni/']

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled false
    }

    tasks.withType(JavaCompile) {
        options.incremental = false
        options.compilerArgs += ["-Xmaxerrs", "50000"]
    }


    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35

        // Google Sign-In server client ID (OAuth "Web application" client of
        // the Creanger Firebase/Cloud project registered for com.creanger.app).
        // Supplied via GOOGLE_WEB_CLIENT_ID in gradle.properties; empty by
        // default — Google button reports a clear error until provided.
        resValue "string", "default_web_client_id",
                (project.findProperty('GOOGLE_WEB_CLIENT_ID') ?: '').toString()

